[project]
name = "ti-lex-agent"
version = "0.1.0"
description = "Agent local Ti-Lex : web, vision et fichiers avec des modèles Ollama"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "ddgs>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ti-lex-agent = "ti_lex_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ti_lex_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
